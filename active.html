<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.5;
        }
        button {
            background-color: blue;
            color: white;
            padding: 12 px 20px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: green;
        }
        button:active {
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Pseudoclasse :active</h1>
    <button type="button">Clique e mantenha pressionado</button>
</body>
</html>
