<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.5;
        }
        input {
            padding: 10px;
            border: 2px solid black;
            cursor: pointer;
            border-radius: 4px;
        }
        input:focus {
            background-color: #e0f2fe;
            border-color: blue;
        }
    </style>
</head>
<body>
    <h1>Pseudoclasse :focus</h1>
    <form>
        <label for="nome">Nome:</label>
        <input id="nome" type="text" placeholder="Digite seu nome">
    </form>
    <p>Clique no campo ou use a tecla tab</p>
</body>
</html>
