<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child { color: red; }
        li:last-child {color: blue;}
    </style>
</head>
<body>
    <h1>Pseudoclasses :first-child e :last-child</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <p>O primeiro item é vermelho e o último é azul</p>
</body>
</html>
