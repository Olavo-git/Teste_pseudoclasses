<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.5;
        }
        button {
            background-color: blue;
            color: white;
            padding: 12 px 20px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: green;
        }
        .efeito:hover {
            color: aqua;
        }
    </style>
</head>
<body>
    <h1>Pseudoclasse :hover</h1>
    <button type="button">Enviar</button>
    <p>Passe o mouse sobre o botão para ver a mudança de cor</p>
    <p class="efeito">Passe o mouse sobre este paragráfo.</p>
</body>
</html>
