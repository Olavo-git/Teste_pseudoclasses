<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li {
            padding: 8px;
        }
        li:nth-child(even) {
            background-color: #999ca1;
        }
        li:nth-child(odd) {
            background-color: rgb(25, 252, 5);
        }
        li:nth-child(2) {
            font-weight: bold;
            color: pink
        }
    </style>
</head>
<body>
    <h1>Pseudoclasses :first-child e :last-child</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>PHP</li>
        <li>Python</li>
        <li>Java</li>
    </ul>
    <p>O primeiro item é vermelho e o último é azul</p>
</body>
</html>
